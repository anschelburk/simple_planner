<form hx-put="{% url 'list_update_item' pk=item.pk %}" hx-trigger="blur" hx-target="this" hx-swap="outerHTML" id="update-item-form">
    {% csrf_token %}
    <input type="text" name="content" value="{{ item.content }}" placeholder="Enter item here..." maxlength="255" required="" id="id_content">
</form>
